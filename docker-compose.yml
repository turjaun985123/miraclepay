# MiraclePay v0.0.2 — local / self-hosted deployment
#
# Services:
#   postgres  — primary database (real, ready to use)
#   redis     — cache / queues (real, optional: starts only with --profile redis)
#   api       — Rust (Axum) backend API
#   worker    — background worker (SMS verification, webhooks, jobs)
#
# Wave 4: the root Dockerfile (API + worker image) and Dockerfile.frontend
# (Astro static site on nginx) both exist, so the full stack builds:
#
# Usage:
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d --build                  # everything
#   docker compose --profile redis up -d          # add Redis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miraclepay
      POSTGRES_USER: miraclepay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miraclepay -d miraclepay"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: miraclepay-api:0.0.3.1
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://miraclepay:change-me@postgres:5432/miraclepay}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-long-random-secret}
      PORT: ${PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: miraclepay-api:0.0.3.1
    # Same image as the api service; the worker is its own binary.
    command: ["miraclepay-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://miraclepay:change-me@postgres:5432/miraclepay}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-long-random-secret}
      PORT: ${PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # The API origin visitors' browsers should call; set
        # PUBLIC_API_URL in .env for any non-localhost deployment.
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    image: miraclepay-frontend:0.0.3.1
    ports:
      - "${FRONTEND_PORT:-4321}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
