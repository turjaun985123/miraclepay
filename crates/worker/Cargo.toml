[package]
name = "miraclepay-worker"
version = "0.0.2"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
miraclepay-domain = { path = "../domain" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
