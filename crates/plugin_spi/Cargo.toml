[package]
name = "miraclepay-plugin-spi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MiraclePay plugin SPI: manifest, confined JS plugin engine (psychoscript), host functions"

[dependencies]
# psychoscript (MIT) — pure-Rust confined JS interpreter, the
# in-process plugin lane (user decision 2026-11-26). PINNED to an
# exact git revision on purpose: the crate is young (created
# 2026-11-13) and its API may move; upgrade deliberately.
# rev bf492e1 = "feat: ArrayBuffer and buffer-backed Uint8Array (#75)"
psychoscript = { git = "https://github.com/anomalyco/psychoscript", rev = "bf492e12017fb25621080676ddb8cd4fa60b7a9d", package = "psychoscript" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
sha2 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
