[package]
name = "miraclepay-sms-verify"
version = "0.0.3"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
miraclepay-domain = { path = "../domain" }
miraclepay-gateways = { path = "../gateways" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
