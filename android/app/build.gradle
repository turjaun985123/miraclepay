// MiraclePay v0.0.2 — Android application module build configuration.
// Clean-room implementation.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miraclepay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.miraclepay.app"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "0.0.2"
    }

    // Wave 87: release signing from the environment only. CI
    // decodes the ANDROID_KEYSTORE_BASE64 secret to a temp file and
    // exports these variables; without them the release build
    // stays unsigned (documented, never faked).
    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.material:material:1.12.0'
}
