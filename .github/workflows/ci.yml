# CI — MiraclePay v0.0.1
#
# Clean-room reimplementation. This workflow verifies all three parts of
# the project on every push and pull request:
#   1. rust     — the Axum backend workspace (tests + build)
#   2. frontend — the Astro frontend (install + production build)
#   3. android  — the Java Android SMS-forwarder app (debug APK)

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      # Wave 49: formatting + lints are release gates, not advice.
      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the workspace test suite
        run: cargo test --workspace

      - name: Build the workspace
        run: cargo build --workspace

  # Wave 49: dependency audit against the RustSec advisory DB.
  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Astro build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lockfile is committed yet, so use `npm install` rather than
      # `npm ci` (which requires a package-lock.json). Switch this step
      # to `npm ci` once a lockfile is committed.
      - name: Install dependencies
        run: npm install

      - name: Build the frontend
        run: npm run build

      # JS SDK tests (Wave 21): zero-dependency node:test suite with a
      # stubbed fetch; runs from the repo root, not the frontend dir.
      - name: Test the JS SDK
        working-directory: ${{ github.workspace }}
        run: npm --prefix sdk/js test

  docker:
    name: Docker (api + frontend images)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the API/worker image
        run: docker build -t miraclepay-api:0.0.1 .

      - name: Build the frontend image
        run: docker build -f Dockerfile.frontend -t miraclepay-frontend:0.0.1 .

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper (gradlew / gradle-wrapper.properties) is
      # committed yet, so Gradle is provisioned by setup-gradle instead.
      # Once the wrapper is committed, this step can be dropped and the
      # build step below can call `./gradlew assembleDebug` directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: gradle assembleDebug

      # Wave 5: also build the release APK and publish both as run
      # artifacts. The release APK is unsigned (no keystore in CI);
      # it proves the release build compiles and packages.
      - name: Build the release APK (unsigned)
        run: gradle assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miraclepay-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
