# CI — MiraclePay v0.0.2
#
# Clean-room reimplementation. This workflow verifies all three parts of
# the project on every push and pull request:
#   1. rust     — the Axum backend workspace (tests + build)
#   2. frontend — the Astro frontend (install + production build)
#   3. android  — the Java Android SMS-forwarder app (debug APK)

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (test + build)
    runs-on: ubuntu-latest
    # Waves 72-73: real Postgres for the persistence integration
    # tests (crates/api/tests/persistence_pg.rs). TEST_DATABASE_URL
    # is set for the whole job; the persistence tests fail hard if
    # it is missing while CI=true, so they cannot silently skip.
    services:
      postgres:
        image: postgres:16
        env:
          # CI-only throwaway database: trust auth on the
          # runner-local service port avoids service-init auth
          # timing failures (28P01 seen on run 45770915471); the
          # database is reachable only from this job's steps.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: miraclepay
          POSTGRES_PASSWORD: <redacted>
          POSTGRES_DB: miraclepay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miraclepay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://miraclepay:miraclepay@localhost:5432/miraclepay
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      # Wave 49: formatting + lints are release gates, not advice.
      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the workspace test suite
        run: cargo test --workspace

      # Wave 91: backup/restore drill against the Postgres service
      # (dump a scratch DB, restore into a fresh one, verify data).
      - name: Backup/restore drill
        run: bash scripts/restore-drill.sh

      - name: Build the workspace
        run: cargo build --workspace

  # Wave 49: dependency audit against the RustSec advisory DB.
  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    # audit-check publishes a check run; the workflow-level
    # contents:read alone made it fail with "Resource not
    # accessible by integration" on its first run (Wave 49).
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Astro build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lockfile is committed yet, so use `npm install` rather than
      # `npm ci` (which requires a package-lock.json). Switch this step
      # to `npm ci` once a lockfile is committed.
      - name: Install dependencies
        run: npm install

      - name: Build the frontend
        run: npm run build

      # JS SDK tests (Wave 21): zero-dependency node:test suite with a
      # stubbed fetch; runs from the repo root, not the frontend dir.
      - name: Test the JS SDK
        working-directory: ${{ github.workspace }}
        run: npm --prefix sdk/js test

  docker:
    name: Docker (api + frontend images)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the API/worker image
        run: docker build -t miraclepay-api:0.0.2 .

      - name: Build the frontend image
        run: docker build -f Dockerfile.frontend -t miraclepay-frontend:0.0.2 .

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper (gradlew / gradle-wrapper.properties) is
      # committed yet, so Gradle is provisioned by setup-gradle instead.
      # Once the wrapper is committed, this step can be dropped and the
      # build step below can call `./gradlew assembleDebug` directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: gradle assembleDebug

      # Wave 87: when the keystore secrets exist, decode the
      # keystore and let Gradle sign the release build (build.gradle
      # reads ANDROID_KEYSTORE_* from the environment). Without the
      # secrets the release stays unsigned — documented, not faked.
      - name: Decode the release keystore (when secrets are present)
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miraclepay-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/miraclepay-release.jks" >> "$GITHUB_ENV"

      # Wave 5: also build the release APK and publish both as run
      # artifacts. Signed when the Wave 87 keystore secrets exist,
      # unsigned otherwise.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miraclepay-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
